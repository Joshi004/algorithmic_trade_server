services:
  ats-db:
    container_name: ats-mysql-db
    image: mysql:8.0.32
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ats_db
      MYSQL_USER: ats_user
      MYSQL_PASSWORD: ats_password
    ports:
      - "13306:3306"
    volumes:
      - ats_mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-network

  ats-redis:
    container_name: ats-redis-server
    image: redis:7
    restart: always
    ports:
      - "16379:6379"
    volumes:
      - ats_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-network

  # Dedicated migration service - runs once and exits
  ats-migrations:
    container_name: ats-migrations
    build: .
    depends_on:
      ats-db:
        condition: service_healthy
      ats-redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      # Database Configuration
      - DATABASE_ENGINE=django.db.backends.mysql
      - DATABASE_NAME=ats_db
      - DATABASE_USER=ats_user
      - DATABASE_PASSWORD=ats_password
      - DATABASE_HOST=ats-db
      - DATABASE_PORT=3306
      
      # Security Keys Configuration
      - DJANGO_SECRET_KEY=prod-django-secret-key-change-in-production-make-it-50-chars-long
      - JWT_LONG_LIVED_TOKEN_SECRET=jwt-llt-secret-key-32-chars-change-this
      - JWT_SHORT_LIVED_TOKEN_SECRET=jwt-slt-secret-key-32-chars-change-this
      - JWT_WEBSOCKET_TOKEN_SECRET=jwt-websocket-secret-key-32-chars-change-this
      - BROKER_API_ENCRYPTION_SECRET=broker-encryption-key-32-chars-change-this-for-production
      - INTERNAL_SERVICE_TOKEN=internal-service-secret-token-change-in-production
      
      # Django Configuration
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,ats-app,ats-django-app,ats-scanning-service
      - DJANGO_SETTINGS_MODULE=ats_base.settings
    command: >
      sh -c "
        echo '🔄 Running database migrations...' &&
        python manage.py migrate &&
        echo '✅ All migrations applied successfully!' &&
        echo '🌱 Applying seed data...' &&
        python manage.py seed_data &&
        echo '✅ Setup complete!'
      "
    restart: "no"
    networks:
      - ats-network

  ats-app:
    container_name: ats-django-app
    build: .
    restart: always
    depends_on:
      - ats-migrations
    ports:
      - "18000:8000"
    volumes:
      - .:/app
    environment:
      # Database Configuration
      - DATABASE_ENGINE=django.db.backends.mysql
      - DATABASE_NAME=ats_db
      - DATABASE_USER=ats_user
      - DATABASE_PASSWORD=ats_password
      - DATABASE_HOST=ats-db
      - DATABASE_PORT=3306
      
      # Security Keys Configuration
      - DJANGO_SECRET_KEY=prod-django-secret-key-change-in-production-make-it-50-chars-long
      - JWT_LONG_LIVED_TOKEN_SECRET=jwt-llt-secret-key-32-chars-change-this
      - JWT_SHORT_LIVED_TOKEN_SECRET=jwt-slt-secret-key-32-chars-change-this
      - JWT_WEBSOCKET_TOKEN_SECRET=jwt-websocket-secret-key-32-chars-change-this
      - BROKER_API_ENCRYPTION_SECRET=broker-encryption-key-32-chars-change-this-for-production
      - INTERNAL_SERVICE_TOKEN=internal-service-secret-token-change-in-production
      
      # Redis Configuration
      - REDIS_HOST=ats-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_SOCKET_TIMEOUT=5
      - REDIS_SOCKET_CONNECT_TIMEOUT=5
      - REDIS_HEALTH_CHECK_INTERVAL=30
      
      # Redis Stream Configuration
      - REDIS_STREAM_SCANNING_QUEUE=scanning_queue
      - REDIS_STREAM_INITIATION_QUEUE=initiation_queue
      - REDIS_STREAM_SCANNER_STATUS=scanner_status_stream
      
      # Consumer Configuration
      - REDIS_CONSUMER_BATCH_SIZE=10
      - REDIS_CONSUMER_TIMEOUT=1000
      
      # Service URLs
      - INTEGRATION_SERVICE_URL=http://ats-app:8000/integration
      - TMU_SERVICE_URL=http://ats-app:8000/tmu
      - SCANNING_SERVICE_URL=http://ats-app:8000/scanning_service
      
      # Service Timeouts
      - SERVICE_REQUEST_TIMEOUT=30
      - SERVICE_CONNECT_TIMEOUT=10
      
      # Django Configuration
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,ats-app,ats-django-app,ats-scanning-service
      - DJANGO_SETTINGS_MODULE=ats_base.settings
    command: >
      sh -c "
        echo '⏳ Waiting for database to be ready...' &&
        until nc -z -v -w30 ats-db 3306; do
          echo 'Waiting for database connection...'
          sleep 5
        done &&
        echo '✅ Database connection established!' &&
        echo '🚀 Starting Django application...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    networks:
      - ats-network

  ats-scanning-service:
    container_name: ats-scanning-service
    build: .
    restart: always
    depends_on:
      - ats-migrations
    volumes:
      - .:/app
    environment:
      # Database Configuration
      - DATABASE_ENGINE=django.db.backends.mysql
      - DATABASE_NAME=ats_db
      - DATABASE_USER=ats_user
      - DATABASE_PASSWORD=ats_password
      - DATABASE_HOST=ats-db
      - DATABASE_PORT=3306
      
      # Security Keys Configuration
      - DJANGO_SECRET_KEY=prod-django-secret-key-change-in-production-make-it-50-chars-long
      - JWT_LONG_LIVED_TOKEN_SECRET=jwt-llt-secret-key-32-chars-change-this
      - JWT_SHORT_LIVED_TOKEN_SECRET=jwt-slt-secret-key-32-chars-change-this
      - JWT_WEBSOCKET_TOKEN_SECRET=jwt-websocket-secret-key-32-chars-change-this
      - BROKER_API_ENCRYPTION_SECRET=broker-encryption-key-32-chars-change-this-for-production
      - INTERNAL_SERVICE_TOKEN=internal-service-secret-token-change-in-production
      
      # Redis Configuration
      - REDIS_HOST=ats-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_SOCKET_TIMEOUT=5
      - REDIS_SOCKET_CONNECT_TIMEOUT=5
      - REDIS_HEALTH_CHECK_INTERVAL=30
      
      # Redis Stream Configuration
      - REDIS_STREAM_SCANNING_QUEUE=scanning_queue
      - REDIS_STREAM_INITIATION_QUEUE=initiation_queue
      - REDIS_STREAM_SCANNER_STATUS=scanner_status_stream
      
      # Consumer Configuration
      - REDIS_CONSUMER_BATCH_SIZE=10
      - REDIS_CONSUMER_TIMEOUT=1000
      
      # Service URLs
      - INTEGRATION_SERVICE_URL=http://ats-app:8000/integration
      - TMU_SERVICE_URL=http://ats-app:8000/tmu
      - SCANNING_SERVICE_URL=http://ats-app:8000/scanning_service
      
      # Service Timeouts
      - SERVICE_REQUEST_TIMEOUT=30
      - SERVICE_CONNECT_TIMEOUT=10
      
      # Django Configuration
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,ats-app,ats-django-app,ats-scanning-service
      - DJANGO_SETTINGS_MODULE=ats_base.settings
    command: >
      sh -c "
        echo '⏳ Waiting for database to be ready...' &&
        until nc -z -v -w30 ats-db 3306; do
          echo 'Waiting for database connection...'
          sleep 5
        done &&
        echo '✅ Database connection established!' &&
        echo '🚀 Starting scanning service...' &&
        python manage.py start_scanning_service --verbose
      "
    networks:
      - ats-network

  # Dedicated session processor monitor service - monitors for orphaned processors
  ats-session-monitor:
    container_name: ats-session-monitor
    build: .
    restart: always
    depends_on:
      - ats-migrations
    volumes:
      - .:/app
    environment:
      # Database Configuration
      - DATABASE_ENGINE=django.db.backends.mysql
      - DATABASE_NAME=ats_db
      - DATABASE_USER=ats_user
      - DATABASE_PASSWORD=ats_password
      - DATABASE_HOST=ats-db
      - DATABASE_PORT=3306
      
      # Security Keys Configuration
      - DJANGO_SECRET_KEY=prod-django-secret-key-change-in-production-make-it-50-chars-long
      - JWT_LONG_LIVED_TOKEN_SECRET=jwt-llt-secret-key-32-chars-change-this
      - JWT_SHORT_LIVED_TOKEN_SECRET=jwt-slt-secret-key-32-chars-change-this
      - JWT_WEBSOCKET_TOKEN_SECRET=jwt-websocket-secret-key-32-chars-change-this
      - BROKER_API_ENCRYPTION_SECRET=broker-encryption-key-32-chars-change-this-for-production
      - INTERNAL_SERVICE_TOKEN=internal-service-secret-token-change-in-production
      
      # Redis Configuration
      - REDIS_HOST=ats-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_SOCKET_TIMEOUT=5
      - REDIS_SOCKET_CONNECT_TIMEOUT=5
      - REDIS_HEALTH_CHECK_INTERVAL=30
      
      # Redis Stream Configuration
      - REDIS_STREAM_SCANNING_QUEUE=scanning_queue
      - REDIS_STREAM_INITIATION_QUEUE=initiation_queue
      - REDIS_STREAM_SCANNER_STATUS=scanner_status_stream
      
      # Monitor Configuration
      - MONITOR_INTERVAL_SECONDS=300  # 5 minutes
      - MONITOR_DRY_RUN=false
      - MONITOR_LOG_LEVEL=INFO
      - MONITOR_PROCESSOR_TYPE=scanner
      
      # Django Configuration
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,ats-app,ats-django-app,ats-scanning-service,ats-session-monitor
      - DJANGO_SETTINGS_MODULE=ats_base.settings
    command: >
      sh -c "
        echo '⏳ Waiting for database to be ready...' &&
        until nc -z -v -w30 ats-db 3306; do
          echo 'Waiting for database connection...'
          sleep 5
        done &&
        echo '✅ Database connection established!' &&
        echo '🔍 Starting session processor monitor...' &&
        python manage.py monitor_session_processors --daemon --processor-type scanner
      "
    networks:
      - ats-network

volumes:
  ats_mysql_data:
  ats_redis_data:

networks:
  ats-network:
    name: ats-network
