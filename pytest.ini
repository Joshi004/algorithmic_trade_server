[pytest]
DJANGO_SETTINGS_MODULE = tests.settings

# Minimal output configuration - shows summary with details only on failures
addopts = 
    --quiet
    --tb=short
    -ra
    --strict-markers
    --disable-warnings
    --maxfail=5
    --reuse-db

# Options explanation:
# --quiet: Reduce verbosity, show minimal output
# --tb=short: Show shorter tracebacks on failures  
# -ra: Show 'all except passes' in summary (failed, error, skipped)
# --maxfail=5: Stop after 5 failures to avoid spam
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
markers =
    unit: Unit tests with minimal dependencies
    integration: Integration tests with real database
    slow: Tests that take longer to run
    requires_db: Tests that require database access
    requires_broker: Tests that require broker credentials
    redis: Tests that require Redis functionality 